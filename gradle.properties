# Memory-constrained build machine: keep the daemon small, no configuration cache.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room 2.6.1 is incompatible with KSP2 ("unexpected jvm signature V") — stay on KSP1.
ksp.useKSP2=false
